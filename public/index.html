<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>
  <p id="indicador"></p>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="doador">Seu nome ou do estabelecimento (doador)</label>
    <input id="doador" placeholder="Ex.: Padaria Pão Bom" autocomplete="organization">
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
  </fieldset>

  <h2>Minhas doações</h2>
  <p><small>Mostra as doações publicadas com o nome de doador acima.</small></p>
  <ul id="minhas"></ul>

  <h2>Doações disponíveis</h2>
  <label for="ong">Nome da sua ONG (para aceitar e devolver)</label>
  <input id="ong" placeholder="Ex.: Casa Esperança" autocomplete="organization">
  <ul id="lista"></ul>

  <h2>Aceitas — aguardando coleta</h2>
  <label for="voluntario">Seu nome (voluntário que vai buscar)</label>
  <input id="voluntario" placeholder="Ex.: Rui" autocomplete="given-name">
  <ul id="aceitas"></ul>

  <script>
    // H1: o doador se identifica pelo nome, guardado neste navegador (D8).
    const campoDoador = document.getElementById('doador');
    try { campoDoador.value = localStorage.getItem('doador') || ''; } catch {}
    try { document.getElementById('voluntario').value = localStorage.getItem('voluntario') || ''; } catch {}
    try { document.getElementById('ong').value = localStorage.getItem('ong') || ''; } catch {}
    campoDoador.onchange = () => {
      try { localStorage.setItem('doador', campoDoador.value.trim()); } catch {}
      carregarMinhas();
    };

    const SITUACAO = {
      disponivel: () => 'disponível — aguardando uma ONG',
      aceita: (d) => `aceita por ${d.ong} — aguardando coleta`,
      coletada: (d) => `coletada${d.ong ? ` por ${d.ong}` : ''}`,
      cancelada: () => 'cancelada por você',
    };

    async function carregarMinhas() {
      const lista = document.getElementById('minhas');
      const doador = campoDoador.value.trim();
      if (!doador) { lista.innerHTML = '<li>Digite o seu nome acima para ver as suas doações.</li>'; return; }
      const res = await fetch(`/api/doacoes/minhas?doador=${encodeURIComponent(doador)}`);
      const doacoes = await res.json();
      lista.innerHTML = doacoes.length ? '' : '<li>Você ainda não publicou doações com este nome.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        const situacao = (SITUACAO[d.status] || (() => d.status))(d);
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) · ${situacao}`;
        lista.appendChild(li);
      }
    }

    async function carregarAceitas() {
      const res = await fetch('/api/doacoes/aceitas');
      const doacoes = await res.json();
      const lista = document.getElementById('aceitas');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação aguardando coleta.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) · ${d.ong} `;
        const botao = document.createElement('button');
        botao.textContent = 'Confirmar coleta';
        botao.onclick = async () => {
          const voluntario = document.getElementById('voluntario').value.trim();
          if (!voluntario) { alert('Digite o seu nome de voluntário antes de confirmar.'); return; }
          try { localStorage.setItem('voluntario', voluntario); } catch {}
          botao.disabled = true; // evita o toque duplo com a conexão lenta
          const res = await fetch(`/api/doacoes/${d.id}/coletar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ voluntario })
          });
          if (!res.ok) alert((await res.json()).erro);
          carregarAceitas();
          carregarMinhas();
        };
        li.appendChild(botao);
        const devolver = document.createElement('button');
        devolver.textContent = 'Devolver (ONG)';
        devolver.onclick = async () => {
          const ong = nomeDaOng();
          if (!ong) return;
          const motivo = prompt('Por que a ONG vai devolver esta doação?', 'sem voluntário hoje');
          if (motivo === null) return;
          const res = await fetch(`/api/doacoes/${d.id}/devolver`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong, motivo })
          });
          if (!res.ok) alert((await res.json()).erro);
          carregar();
          carregarAceitas();
          carregarMinhas();
        };
        li.appendChild(devolver);
        lista.appendChild(li);
      }
    }

    function nomeDaOng() {
      const ong = document.getElementById('ong').value.trim();
      if (!ong) { alert('Digite o nome da sua ONG antes.'); return ''; }
      try { localStorage.setItem('ong', ong); } catch {}
      return ong;
    }

    async function carregar() {
      const res = await fetch('/api/doacoes');
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          const ong = nomeDaOng();
          if (!ong) return;
          const res = await fetch(`/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong })
          });
          if (!res.ok) alert((await res.json()).erro);
          carregar();
          carregarAceitas();
          carregarMinhas();
          carregarIndicador();
        };
        li.appendChild(botao);
        const cancelar = document.createElement('button');
        cancelar.textContent = 'Cancelar (doador)';
        cancelar.onclick = async () => {
          if (!confirm(`Cancelar a doação de ${d.tipo}?`)) return;
          await fetch(`/api/doacoes/${d.id}/cancelar`, { method: 'POST' });
          carregar();
          carregarMinhas();
        };
        li.appendChild(cancelar);
        lista.appendChild(li);
      }
    }

    document.getElementById('publicar').onclick = async () => {
      try { localStorage.setItem('doador', campoDoador.value.trim()); } catch {}
      const res = await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          doador: campoDoador.value,
          tipo: document.getElementById('tipo').value,
          quantidade: document.getElementById('quantidade').value,
          validade: document.getElementById('validade').value
        })
      });
      if (!res.ok) { alert((await res.json()).erro); return; }
      carregar();
      carregarMinhas();
    };

    async function carregarIndicador() {
      const res = await fetch('/api/indicadores/aceitas-no-mes');
      const { mes, aceitas } = await res.json();
      document.getElementById('indicador').textContent =
        `Doações aceitas em ${mes}: ${aceitas}`;
    }

    carregar();
    carregarAceitas();
    carregarMinhas();
    carregarIndicador();
  </script>
</body>
</html>
